<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">DPI Easy</title>
  <desc id="description">GoodbyeDPI-Turkey için taşınabilir Windows yönetim arayüzü.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="1" stop-color="#10283d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d3a7"/>
      <stop offset="1" stop-color="#36a8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#background)"/>
  <circle cx="1050" cy="-40" r="220" fill="#20d3a7" opacity=".08"/>
  <circle cx="1130" cy="360" r="250" fill="#36a8ff" opacity=".08"/>

  <g transform="translate(72 72)">
    <rect width="64" height="64" rx="18" fill="url(#accent)"/>
    <path d="M18 33h10l5-13 7 27 6-14h8" fill="none" stroke="#06121e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="150" fill="#f5fbff" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="700">DPI Easy</text>
    <text x="2" y="199" fill="#a9bfd1" font-family="Segoe UI, Arial, sans-serif" font-size="25">GoodbyeDPI-Turkey için taşınabilir Windows arayüzü</text>

    <g transform="translate(0 238)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
      <rect width="132" height="40" rx="20" fill="#17384a"/>
      <text x="66" y="26" fill="#bdeee3" text-anchor="middle">Otomatik profil</text>
      <rect x="144" width="116" height="40" rx="20" fill="#17384a"/>
      <text x="202" y="26" fill="#bdeee3" text-anchor="middle">Canlı durum</text>
      <rect x="272" width="108" height="40" rx="20" fill="#17384a"/>
      <text x="326" y="26" fill="#bdeee3" text-anchor="middle">Taşınabilir</text>
    </g>
  </g>

  <g transform="translate(744 56)" filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="388" height="288" rx="18" fill="#f7fafc"/>
    <path d="M18 0h352a18 18 0 0 1 18 18v34H0V18A18 18 0 0 1 18 0z" fill="#e8eef3"/>
    <circle cx="24" cy="26" r="6" fill="#ff6370"/>
    <circle cx="44" cy="26" r="6" fill="#ffbd4a"/>
    <circle cx="64" cy="26" r="6" fill="#22c98b"/>
    <text x="194" y="32" fill="#385267" font-size="15" font-weight="600" text-anchor="middle">DPI Easy 0.1.0</text>

    <text x="28" y="88" fill="#677d8f" font-size="13">ÇALIŞMA DURUMU</text>
    <circle cx="38" cy="116" r="9" fill="#20c98b"/>
    <text x="56" y="122" fill="#163247" font-size="22" font-weight="700">Açık</text>
    <text x="28" y="153" fill="#667c8d" font-size="14">Dengeli + yönlendirilmiş DNS</text>

    <rect x="28" y="176" width="332" height="54" rx="12" fill="url(#accent)"/>
    <text x="194" y="210" fill="#06121e" font-size="18" font-weight="700" text-anchor="middle">Kapat</text>

    <rect x="28" y="242" width="160" height="28" rx="14" fill="#e5f8f2"/>
    <text x="108" y="261" fill="#168464" font-size="12" font-weight="600" text-anchor="middle">Bağlantı sağlıklı 3/3</text>
    <rect x="200" y="242" width="160" height="28" rx="14" fill="#e9f4fd"/>
    <text x="280" y="261" fill="#2577ac" font-size="12" font-weight="600" text-anchor="middle">Profil otomatik seçildi</text>
  </g>
